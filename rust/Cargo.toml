[package]
name = "openclaw-rust"
version = "0.1.0"
edition = "2024"
description = "Rust reimplementation of the retained OpenClaw Go runtime"
license = "MIT"

[lib]
name = "openclaw"
path = "src/lib.rs"

[[bin]]
name = "openclaw"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
regex = "1.12.4"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
